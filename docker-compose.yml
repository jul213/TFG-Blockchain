services:
  tfg_ganache_final:
    image: trufflesuite/ganache-cli:latest
    container_name: tfg_ganache_final
    restart: always
    command: ["--db=/app/database", "--mnemonic=tfg_blockchain_secret_seed_phrase", "--networkId=1778279372631", "--host=0.0.0.0"]
    volumes:
      - ganache_data:/app/database
    networks:
      - tfg_internal_nw
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect({host:'127.0.0.1',port:8545}).on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})\""]
      interval: 15s
      timeout: 5s
      retries: 10

  tfg_db:
    image: postgres:15-alpine
    container_name: tfg_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-julio_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tfg_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-erp_universitario}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - tfg_internal_nw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-julio_admin} -d ${POSTGRES_DB:-erp_universitario}"]
      interval: 15s
      timeout: 5s
      retries: 10

  tfg_backend_final:
    image: node:18-alpine
    container_name: tfg_backend_final
    restart: always
    working_dir: /app/blockchain
    volumes:
      - .:/app
    depends_on:
      tfg_ganache_final:
        condition: service_healthy
      tfg_db:
        condition: service_healthy
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_IN_ENV}
      TOKEN_TTL: ${TOKEN_TTL:-2h}
      DB_HOST: tfg_db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-julio_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-tfg_password_2026}
      DB_NAME: ${POSTGRES_DB:-erp_universitario}
      WEB3_RPC_URL: http://tfg_ganache_final:8545
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,https://localhost,https://127.0.0.1}
    command: sh -c "npm install && node bootstrap.js"
    networks:
      - tfg_internal_nw
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health-check',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10

  tfg_frontend_final:
    image: nginx:stable-alpine
    container_name: tfg_frontend_final
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      tfg_backend_final:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - tfg_internal_nw

  tfg_prometheus:
    image: prom/prometheus:latest
    container_name: tfg_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./soc/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      tfg_backend_final:
        condition: service_healthy
      tfg_alertmanager:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/-/healthy >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - tfg_internal_nw

  tfg_alertmanager:
    image: prom/alertmanager:latest
    container_name: tfg_alertmanager
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - alertmanager_data:/alertmanager
      - ./soc/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    depends_on:
      tfg_discord_webhook_relay:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9093/-/healthy >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - tfg_internal_nw

  tfg_discord_webhook_relay:
    build:
      context: ./discord-relay
      dockerfile: Dockerfile
    container_name: tfg_discord_webhook_relay
    restart: always
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - tfg_internal_nw

  tfg_grafana:
    image: grafana/grafana:latest
    container_name: tfg_grafana
    restart: always
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    depends_on:
      - tfg_prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - tfg_internal_nw

  tfg_loki:
    image: grafana/loki:latest
    container_name: tfg_loki
    restart: always
    volumes:
      - loki_data:/loki
      - ./soc/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3100/ready >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - tfg_internal_nw

  tfg_promtail:
    image: grafana/promtail:latest
    container_name: tfg_promtail
    restart: always
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./soc/promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail_data:/tmp
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - tfg_loki
    networks:
      - tfg_internal_nw

networks:
  tfg_internal_nw:
    driver: bridge

volumes:
  ganache_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:
  promtail_data:
