global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['tfg_alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'tfg_backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['tfg_backend_final:3000']

  - job_name: 'tfg_grafana'
    metrics_path: /metrics
    static_configs:
      - targets: ['tfg_grafana:3000']

  - job_name: 'tfg_loki'
    metrics_path: /metrics
    static_configs:
      - targets: ['tfg_loki:3100']
