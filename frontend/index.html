<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGU - Sistema de Gestión Universitaria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .sidebar-item { transition: all 0.2s ease; }
        .sidebar-item:hover { background: rgba(255,255,255,0.05); transform: translateX(4px); }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900">
    <div id="toast-container" class="fixed top-4 right-4 z-[100] space-y-2"></div>

    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-[#0f172a] px-4">
        <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md animate-fade-in">
            <div class="flex justify-center mb-8">
                <div class="p-4 bg-blue-50 rounded-2xl text-blue-600 shadow-sm"><i data-lucide="graduation-cap" class="w-12 h-12"></i></div>
            </div>
            <h2 class="text-3xl font-bold text-center mb-2 text-slate-800">SGU Académico</h2>
            <p class="text-center text-slate-500 mb-8 font-medium">Gestión Universitaria & Blockchain</p>
            <div class="space-y-5">
                <div class="relative">
                    <i data-lucide="user" class="absolute left-3 top-3.5 w-5 h-5 text-slate-400"></i>
                    <input type="text" id="username" class="w-full pl-11 pr-4 py-3.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Usuario">
                </div>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-3 top-3.5 w-5 h-5 text-slate-400"></i>
                    <input type="password" id="password" class="w-full pl-11 pr-4 py-3.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Contraseña">
                </div>
                <div class="relative">
                    <i data-lucide="shield" class="absolute left-3 top-3.5 w-5 h-5 text-slate-400"></i>
                    <input type="password" id="mfa_code" class="w-full pl-11 pr-4 py-3.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="MFA opcional">
                </div>
                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-blue-200 active:scale-[0.98]">Acceder al sistema</button>
            </div>
        </div>
    </div>

    <div id="dashboard" class="hidden min-h-screen flex flex-col md:flex-row">
        <aside class="w-full md:w-72 bg-[#0f172a] text-white flex flex-col shrink-0 shadow-2xl z-20">
            <div class="p-8 border-b border-slate-800 flex items-center gap-4">
                <div class="bg-blue-600 p-2 rounded-lg shadow-lg shadow-blue-900/20"><i data-lucide="shield-check" class="w-6 h-6"></i></div>
                <span class="font-bold text-xl tracking-tight">SGU-ERP</span>
            </div>
            <nav id="sidebar-menu" class="flex-1 p-6 space-y-3"></nav>
            <div class="p-8 border-t border-slate-800 bg-[#0a0f1d]">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 bg-slate-700 rounded-full flex items-center justify-center font-bold text-blue-400 border border-slate-600" id="user-initials">JM</div>
                    <div>
                        <p id="user-display-name" class="font-bold text-sm text-white"></p>
                        <p class="text-[10px] text-blue-400 font-bold uppercase tracking-tighter">Profesorado Activo</p>
                    </div>
                </div>
                <button onclick="logout()" class="w-full text-red-400 hover:text-red-300 text-sm flex items-center gap-2 transition group">
                    <i data-lucide="log-out" class="w-4 h-4 group-hover:-translate-x-1 transition"></i> Cerrar Sesión
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 px-10 flex items-center justify-between sticky top-0 z-10">
                <div class="flex items-center gap-3">
                    <div class="w-1 h-6 bg-blue-600 rounded-full"></div>
                    <h1 id="page-title" class="font-bold text-2xl text-slate-800 tracking-tight">Cargando...</h1>
                </div>
                <div class="flex items-center gap-6">
                    <div class="hidden md:flex items-center gap-2.5 text-xs bg-emerald-50 text-emerald-700 px-4 py-2 rounded-full font-bold border border-emerald-100">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> Nodo Blockchain Activo
                    </div>
                    <div id="wallet-status" class="hidden md:flex items-center gap-2.5 text-xs bg-amber-50 text-amber-700 px-4 py-2 rounded-full font-bold border border-amber-100">
                        Wallet no detectada
                    </div>
                    <button onclick="showQR()" class="bg-slate-50 p-3 rounded-xl hover:bg-white hover:shadow-md border border-slate-100 text-slate-600 transition active:scale-95">
                        <i data-lucide="qr-code" class="w-6 h-6"></i>
                    </button>
                </div>
            </header>

            <div id="content-area" class="p-10 overflow-y-auto flex-1"></div>
        </main>
    </div>

    <div id="qr-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center z-50 p-4 transition-all">
        <div class="bg-white p-10 rounded-[2.5rem] max-w-sm w-full text-center shadow-[0_20px_50px_rgba(0,0,0,0.3)] animate-fade-in border border-white/20">
            <h3 class="font-bold text-2xl text-slate-800 mb-2">Acceso Móvil</h3>
            <p class="text-sm text-slate-500 mb-8">Escanea para continuar en tu smartphone</p>
            <div id="qrcode-container" class="inline-block bg-white p-5 rounded-3xl border-2 border-slate-50 mb-8 shadow-inner"></div>
            <button onclick="closeQR()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl hover:bg-black transition shadow-lg">Entendido</button>
        </div>
    </div>

    <script>
        const API_URL = '';
        let txState = 'idle';
        const MENU_BY_ROLE = {
            STUDENT: ['Mis Cursos', 'Consultar Notas'],
            TEACHER: ['Pasar Asistencia', 'Subir Notas', 'Consultar Notas', 'Mis Cursos'],
            RECTOR: ['Informes', 'Observabilidad']
        };
        const ICONS = {
            'Pasar Asistencia': 'check-square',
            'Subir Notas': 'database',
            'Consultar Notas': 'clipboard-list',
            'Mis Cursos': 'book-open',
            'Informes': 'bar-chart-3',
            'Observabilidad': 'monitor-check'
        };

        function showToast(message, variant = 'info') {
            const colors = {
                info: 'bg-slate-900 text-white',
                success: 'bg-emerald-600 text-white',
                error: 'bg-red-600 text-white'
            };
            const toast = document.createElement('div');
            toast.className = `${colors[variant] || colors.info} px-4 py-3 rounded-xl shadow-lg text-sm font-semibold`;
            toast.textContent = message;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        const gradeTone = (value) => {
            const score = Number(value);
            if (Number.isNaN(score)) return 'bg-slate-500';
            if (score < 5) return 'bg-red-500';
            if (score < 7) return 'bg-amber-500';
            return 'bg-emerald-500';
        };

        function exportRectorPDF() {
            const report = window.lastRectorReport;
            if (!report) {
                showToast('Primero carga los informes', 'error');
                return;
            }
            fetch(`${API_URL}/api/rector/report-export`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${localStorage.getItem('tfg_token') || ''}`
                },
                body: JSON.stringify({ format: 'pdf' })
            }).catch(() => {});
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape' });
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(20);
            doc.text('SGU - Informe Rectoral', 14, 18);
            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            doc.text(`Generado: ${new Date().toLocaleString('es-ES')}`, 14, 25);
            const analytics = report.analytics || report.insights || {};
            const topRisk = (analytics.studentRiskRanking || [])[0];
            const weakestCourse = (analytics.courseHealthRanking || [])[0];
            const strongestTrend = (analytics.descendingTrendRanking || [])[0];
            const topAnomaly = (analytics.anomalies || [])[0];

            doc.setFontSize(11);
            doc.text(`Riesgo máximo: ${topRisk ? `${topRisk.entity} (${topRisk.riskScore})` : 'N/D'}`, 14, 31);
            doc.text(`Curso más débil: ${weakestCourse ? `${weakestCourse.entity} (${weakestCourse.healthScore})` : 'N/D'}`, 14, 37);
            doc.text(`Tendencia negativa: ${strongestTrend ? `${strongestTrend.scope}: ${strongestTrend.entity}` : 'N/D'}`, 14, 43);
            doc.text(`Anomalías: ${analytics.anomalies ? analytics.anomalies.length : 0}`, 14, 49);

            doc.autoTable({
                startY: 56,
                head: [['Rol', 'Total']],
                body: (report.roleBreakdown || []).map((row) => [row.role, String(row.total)]),
                theme: 'grid',
                headStyles: { fillColor: [15, 23, 42] }
            });

            doc.autoTable({
                startY: doc.lastAutoTable.finalY + 8,
                head: [['Curso', 'Estudiantes']],
                body: (report.courses || []).map((row) => [row.course_name, String(row.total_students)]),
                theme: 'grid',
                headStyles: { fillColor: [37, 99, 235] }
            });

            doc.autoTable({
                startY: doc.lastAutoTable.finalY + 8,
                head: [['Nota', 'Total']],
                body: (report.gradeDistribution || []).map((row) => [`${row.bucket}`, String(row.total)]),
                theme: 'grid',
                headStyles: { fillColor: [16, 185, 129] }
            });

            doc.autoTable({
                startY: doc.lastAutoTable.finalY + 8,
                head: [['Estudiante', 'Asignatura', 'Nota', 'Hash']],
                body: (report.latestGrades || []).map((row) => [row.student_email, row.subject, String(row.grade), row.blockchain_hash]),
                theme: 'striped',
                styles: { fontSize: 8, cellWidth: 'wrap' },
                headStyles: { fillColor: [15, 23, 42] }
            });

            if (analytics.studentRiskRanking && analytics.studentRiskRanking.length) {
                doc.autoTable({
                    startY: doc.lastAutoTable.finalY + 8,
                    head: [['Estudiante', 'Riesgo', 'Media', 'Pendiente/semana']],
                    body: analytics.studentRiskRanking.slice(0, 10).map((row) => [row.entity, String(row.riskScore), String(row.average), String(row.slopePerWeek)]),
                    theme: 'grid',
                    headStyles: { fillColor: [220, 38, 38] }
                });
            }

            if (analytics.courseHealthRanking && analytics.courseHealthRanking.length) {
                doc.autoTable({
                    startY: doc.lastAutoTable.finalY + 8,
                    head: [['Curso', 'Salud', 'Media', 'Pendiente/semana']],
                    body: analytics.courseHealthRanking.slice(0, 10).map((row) => [row.entity, String(row.healthScore), String(row.average), String(row.slopePerWeek)]),
                    theme: 'grid',
                    headStyles: { fillColor: [16, 185, 129] }
                });
            }

            if (analytics.descendingTrendRanking && analytics.descendingTrendRanking.length) {
                doc.autoTable({
                    startY: doc.lastAutoTable.finalY + 8,
                    head: [['Scope', 'Entidad', 'Pendiente/semana', 'Score']],
                    body: analytics.descendingTrendRanking.slice(0, 10).map((row) => [row.scope, row.entity, String(row.slopePerWeek), String(row.trendScore)]),
                    theme: 'grid',
                    headStyles: { fillColor: [37, 99, 235] }
                });
            }

            if (analytics.anomalies && analytics.anomalies.length) {
                doc.autoTable({
                    startY: doc.lastAutoTable.finalY + 8,
                    head: [['Scope', 'Entidad', 'Anomalía', 'Última nota']],
                    body: analytics.anomalies.slice(0, 10).map((row) => [row.scope, row.entity, String(row.anomalyScore), String(row.lastGrade)]),
                    theme: 'grid',
                    headStyles: { fillColor: [190, 24, 93] }
                });
            }

            if (analytics.formulas) {
                doc.autoTable({
                    startY: doc.lastAutoTable.finalY + 8,
                    head: [['Métrica', 'Fórmula']],
                    body: [
                        ['Riesgo de abandono', analytics.formulas.abandonmentRisk || 'N/D'],
                        ['Salud de curso', analytics.formulas.courseHealth || 'N/D'],
                        ['Tendencia descendente', analytics.formulas.descendingTrend || 'N/D'],
                        ['Anomalías', analytics.formulas.anomalies || 'N/D']
                    ],
                    theme: 'grid',
                    styles: { fontSize: 8, cellWidth: 'wrap' },
                    headStyles: { fillColor: [15, 23, 42] }
                });
            }

            doc.save('informe-rectoral.pdf');
        }

        async function detectWallet() {
            const badge = document.getElementById('wallet-status');
            if (!badge) return;
            if (!window.ethereum) {
                badge.className = "hidden md:flex items-center gap-2.5 text-xs bg-amber-50 text-amber-700 px-4 py-2 rounded-full font-bold border border-amber-100";
                badge.textContent = 'Wallet no detectada';
                return;
            }
            try {
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                badge.className = "hidden md:flex items-center gap-2.5 text-xs bg-emerald-50 text-emerald-700 px-4 py-2 rounded-full font-bold border border-emerald-100";
                badge.textContent = accounts.length ? 'Wallet conectada' : 'Wallet detectada';
            } catch (_e) {
                badge.className = "hidden md:flex items-center gap-2.5 text-xs bg-red-50 text-red-700 px-4 py-2 rounded-full font-bold border border-red-100";
                badge.textContent = 'Error Wallet';
            }
        }
        
        let currentUser = JSON.parse(localStorage.getItem('tfg_user')) || null;

        async function apiFetch(path, options = {}) {
            const token = localStorage.getItem('tfg_token');
            const requestId = (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : `web-${Date.now()}-${Math.random().toString(16).slice(2)}`;
            const headers = {
                'Content-Type': 'application/json',
                'X-Request-Id': requestId,
                ...(options.headers || {})
            };
            if (token) headers.Authorization = `Bearer ${token}`;
            const response = await fetch(`${API_URL}${path}`, { ...options, headers });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.success === false) {
                const error = new Error(payload.error?.message || payload.message || `Error ${response.status}`);
                error.code = payload.error?.code;
                error.requestId = payload.error?.requestId || payload.requestId || requestId;
                throw error;
            }
            return payload;
        }

        async function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const mfa_code = document.getElementById('mfa_code').value.trim();
            if(!user || !pass) return;
            try {
                const res = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user, pass, mfa_code})
                });
                const data = await res.json();
                if(data.success) {
                    localStorage.setItem('tfg_token', data.token);
                    localStorage.setItem('tfg_user', JSON.stringify({role: data.role, role_id: data.role_id, name: data.name, user: user}));
                    location.reload();
                } else if (data.mfa_required) {
                    showToast("MFA requerido para este rol", "error");
                } else { showToast("Credenciales inválidas", "error"); }
            } catch(e) { showToast("Servidor offline o certificado no confiable", "error"); }
        }

        async function loadContent(page) {
            const area = document.getElementById('content-area');
            document.getElementById('page-title').innerText = page;
            area.innerHTML = '<div class="flex flex-col items-center justify-center h-64 gap-4"><div class="w-12 h-12 border-4 border-blue-600/20 border-t-blue-600 rounded-full animate-spin"></div><p class="text-slate-400 font-medium animate-pulse">Sincronizando con Postgres...</p></div>';

            if(page === 'Subir Notas') {
                if (!['TEACHER', 'RECTOR'].includes(currentUser.role)) {
                    area.innerHTML = '<div class="p-8 bg-red-50 text-red-600 rounded-2xl font-bold border border-red-100">No autorizado para subir notas.</div>';
                    return;
                }
                renderSubirNotas();
            } else if(page === 'Consultar Notas') {
                renderConsultarNotas();
            } else if (page === 'Mis Cursos') {
                renderMisCursos();
            } else if (page === 'Pasar Asistencia') {
                renderPasarAsistencia();
            } else if (page === 'Informes') {
                renderInformesRector();
            } else if (page === 'Observabilidad') {
                renderObservability();
            } else {
                area.innerHTML = '<div class="text-red-500 font-bold p-8 bg-red-50 rounded-2xl border border-red-100">Vista no disponible</div>';
            }
            lucide.createIcons();
        }

        function renderSubirNotas() {
            document.getElementById('content-area').innerHTML = `
            <div class="max-w-2xl mx-auto glass-card p-12 rounded-[2.5rem] shadow-xl animate-fade-in text-center relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-600 to-indigo-600"></div>
                <div class="bg-indigo-50 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-6 text-indigo-600 shadow-inner">
                    <i data-lucide="database" class="w-10 h-10"></i>
                </div>
                <h2 class="font-bold text-3xl mb-2 text-slate-800 tracking-tight">Sello Blockchain</h2>
                <p class="text-slate-500 mb-10 font-medium">Inmutabilidad garantizada vía Contrato Inteligente</p>
                <div class="space-y-5 text-left">
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase ml-1 mb-2 block">Datos del Estudiante</label>
                        <input id="stu" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 transition" placeholder="Nombre completo">
                    </div>
                    <div class="grid grid-cols-2 gap-5">
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase ml-1 mb-2 block">Asignatura</label>
                            <input id="asig" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 transition" placeholder="Cód/Materia">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase ml-1 mb-2 block">Nota Final</label>
                            <input id="not" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 transition" placeholder="0-10">
                        </div>
                    </div>
                    <button onclick="firmarNota()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-5 rounded-2xl transition shadow-xl shadow-indigo-100 mt-6 active:scale-[0.98]">
                        Certificar en Red Principal
                    </button>
                </div>
                <div id="res" class="mt-8"></div>
            </div>`;
            lucide.createIcons();
        }

        async function renderConsultarNotas() {
            const area = document.getElementById('content-area');
            try {
                const data = await apiFetch('/api/consultar-notas');
                const notas = data.notas || data.data || [];

                let html = `
                <div class="animate-fade-in space-y-6">
                    <div class="glass-card p-8 rounded-[2rem] overflow-hidden shadow-sm">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="text-[11px] font-bold text-slate-400 uppercase tracking-widest border-b border-slate-100">
                                    <th class="pb-5 pl-4">Estudiante</th>
                                    <th class="pb-5">Asignatura</th>
                                    <th class="pb-5">Nota</th>
                                    <th class="pb-5 text-center">Certificado Blockchain</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-50">`;

                notas.forEach(nota => {
                    html += `
                    <tr class="hover:bg-slate-50/50 transition-colors group">
                        <td class="py-5 pl-4">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 bg-blue-50 rounded-lg flex items-center justify-center text-blue-600 text-xs font-bold">${nota.student_email[0].toUpperCase()}</div>
                                <span class="font-semibold text-slate-700">${nota.student_email}</span>
                            </div>
                        </td>
                        <td class="py-5 text-slate-600 font-medium">${nota.subject}</td>
                        <td class="py-5"><span class="${gradeTone(nota.grade)} text-white px-3 py-1 rounded-lg text-xs font-bold">${nota.grade}</span></td>
                        <td class="py-5">
                            <div class="flex items-center justify-center gap-2">
                                <i data-lucide="link" class="w-3 h-3 text-emerald-500"></i>
                                <span class="text-[10px] font-mono text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-100 max-w-[140px] truncate" title="${nota.blockchain_hash}">
                                    ${nota.blockchain_hash}
                                </span>
                            </div>
                        </td>
                    </tr>`;
                });

                html += `</tbody></table></div></div>`;
                area.innerHTML = html;
            } catch(e) {
                area.innerHTML = '<div class="p-8 bg-red-50 text-red-600 rounded-2xl font-bold border border-red-100 flex items-center gap-3"><i data-lucide="alert-circle"></i> Error al recuperar registros de la base de datos</div>';
            }
            lucide.createIcons();
        }

        async function renderMisCursos() {
            const area = document.getElementById('content-area');
            try {
                const payload = await apiFetch('/api/mis-cursos');
                const cursos = payload.data || [];
                const html = `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 animate-fade-in">
                        ${cursos.map((c) => `
                            <div class="glass-card p-6 rounded-2xl">
                                <h3 class="font-bold text-xl text-slate-800">${c.course_name}</h3>

                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 xl:grid-cols-6 gap-3 mb-4">
                                <input id="explorer-filter-block" class="p-3 rounded-xl bg-slate-50 border border-slate-100 text-sm" placeholder="Bloque">
                                <input id="explorer-filter-hash" class="p-3 rounded-xl bg-slate-50 border border-slate-100 text-sm" placeholder="Hash / tx">
                                <input id="explorer-filter-address" class="p-3 rounded-xl bg-slate-50 border border-slate-100 text-sm" placeholder="Dirección">
                                <input id="explorer-filter-event" class="p-3 rounded-xl bg-slate-50 border border-slate-100 text-sm" placeholder="Evento">
                                <input id="explorer-filter-request" class="p-3 rounded-xl bg-slate-50 border border-slate-100 text-sm" placeholder="request_id">
                                <input id="explorer-filter-actor" class="p-3 rounded-xl bg-slate-50 border border-slate-100 text-sm" placeholder="Actor">
                                <input id="explorer-filter-gas" class="p-3 rounded-xl bg-slate-50 border border-slate-100 text-sm md:col-span-2" placeholder="Gas mínimo">
                            </div>
                            <div id="explorer-contracts" class="flex flex-wrap gap-2 mb-4"></div>
                            <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
                                <div>
                                    <div class="flex items-center justify-between mb-3">
                                        <h4 class="font-bold text-slate-800">Entradas trazables</h4>
                                        <span id="explorer-count" class="text-xs text-slate-500 font-semibold"></span>
                                    </div>
                                    <div id="explorer-list" class="space-y-3"></div>
                                </div>
                                <div class="space-y-4">
                                    <div>
                                        <div class="flex items-center justify-between mb-3">
                                            <h4 class="font-bold text-slate-800">Bloques recientes</h4>
                                            <span id="block-count" class="text-xs text-slate-500 font-semibold"></span>
                                        </div>
                                        <div id="block-list" class="space-y-3"></div>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-slate-800 mb-3">Auditoría reciente</h4>
                                        <div id="audit-list" class="space-y-2"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                const renderContractBadges = (contracts = []) => contracts.map((contract) => `
                    <span class="inline-flex items-center gap-2 rounded-full bg-blue-50 text-blue-700 border border-blue-100 px-3 py-1 text-[11px] font-bold">
                        <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                        ${contract.name}
                        <span class="font-mono text-[10px] opacity-70">${contract.address.slice(0, 10)}...</span>
                    </span>
                `).join('');

                const renderEntry = (entry) => {
                    const sourceClasses = entry.source === 'db'
                        ? 'bg-emerald-50 text-emerald-700 border-emerald-100'
                        : 'bg-blue-50 text-blue-700 border-blue-100';
                    const detailLine = entry.entityType === 'grade'
                        ? `${entry.studentEmail} · ${entry.subject} · ${entry.grade}`
                        : entry.entityType === 'audit'
                            ? `${entry.actor || 'n/a'} · ${entry.role || 'n/a'} · ${entry.status || 'n/a'}`
                            : `${entry.from || 'n/a'} → ${entry.to || 'n/a'}`;
                    return `
                        <div class="p-4 rounded-2xl border border-slate-100 bg-slate-50">
                            <div class="flex items-start justify-between gap-3">
                                <div class="min-w-0">
                                    <div class="flex flex-wrap items-center gap-2">
                                        <span class="px-2 py-1 rounded-full text-[10px] font-bold ${sourceClasses} border">${entry.source === 'db' ? 'DB + Chain' : 'Chain'}</span>
                                        <span class="px-2 py-1 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700 border border-slate-200">${entry.originContract || entry.contractName || 'N/D'}</span>
                                        <span class="px-2 py-1 rounded-full text-[10px] font-bold bg-white text-slate-600 border border-slate-200">${entry.eventType || 'TX'}</span>
                                    </div>
                                    <p class="mt-2 font-bold text-slate-800">${entry.summary || entry.eventName || entry.eventType || 'Entrada'}</p>
                                    <p class="text-[11px] text-slate-500 font-mono break-all">${entry.txHash || 'sin hash'}</p>
                                </div>
                                <div class="text-right text-[11px] text-slate-600 shrink-0">
                                    <p><b>Bloque</b> ${entry.blockNumber ?? 'N/D'}</p>
                                    <p><b>Gas</b> ${entry.gasUsed ?? 'N/D'}</p>
                                    <p><b>Fecha</b> ${entry.timestamp ? new Date(entry.timestamp).toLocaleString('es-ES') : 'N/D'}</p>
                                </div>
                            </div>
                            <div class="mt-3 text-xs text-slate-600">
                                <p>${detailLine}</p>
                                <p class="mt-1 text-[11px] text-slate-500 break-all">${entry.from ? `From: ${entry.from}` : ''}${entry.from && entry.to ? ' · ' : ''}${entry.to ? `To: ${entry.to}` : ''}</p>
                                <p class="mt-1 text-[11px] text-slate-500">${entry.contractName ? `Contrato: ${entry.contractName}` : 'Contrato: N/D'}${entry.eventName ? ` · Evento on-chain: ${entry.eventName}` : ''}</p>
                                <p class="mt-1 text-[11px] text-slate-500">${entry.requestId ? `request_id: ${entry.requestId}` : 'request_id: n/a'}${entry.dbRelation ? ` · ${entry.dbRelation}` : ''}</p>
                            </div>
                        </div>
                    `;
                };

                const renderBlock = (block) => `
                    <div class="p-4 rounded-2xl border border-slate-100 bg-slate-50">
                        <div class="flex items-start justify-between gap-3">
                            <div>
                                <p class="font-bold text-slate-800">Bloque #${block.number}</p>
                                <p class="text-[11px] text-slate-500 font-mono break-all">${block.hash}</p>
                            </div>
                            <div class="text-right text-[11px] text-slate-600">
                                <p><b>Gas usado</b> ${block.gasUsed}</p>
                                <p><b>Tx</b> ${(block.transactions || []).length}</p>
                                <p><b>Fecha</b> ${block.timestampIso ? new Date(block.timestampIso).toLocaleString('es-ES') : 'N/D'}</p>
                            </div>
                        </div>
                    </div>
                `;

                const renderAudit = (event) => `
                    <div class="rounded-xl bg-slate-50 border border-slate-100 p-3">
                        <div class="flex items-center justify-between gap-3">
                            <p class="text-xs font-bold text-slate-800">${event.event_type} · ${event.status}</p>
                            <span class="text-[10px] px-2 py-1 rounded-full bg-white border border-slate-200 text-slate-600 font-bold">${event.severity || 'low'}</span>
                        </div>
                        <p class="text-[11px] text-slate-500 font-mono truncate mt-1" title="${event.request_id || ''}">${event.request_id || 'sin request_id'}</p>
                        <p class="text-[11px] text-slate-500 mt-1">${event.actor || 'n/a'}${event.role ? ` · ${event.role}` : ''}</p>
                    </div>
                `;

                let explorerTimer = null;
                const loadExplorerData = async () => {
                    const query = new URLSearchParams();
                    const appendIf = (name, id) => {
                        const value = document.getElementById(id)?.value?.trim();
                        if (value) query.set(name, value);
                    };
                    appendIf('block', 'explorer-filter-block');
                    appendIf('hash', 'explorer-filter-hash');
                    appendIf('address', 'explorer-filter-address');
                    appendIf('event_type', 'explorer-filter-event');
                    appendIf('request_id', 'explorer-filter-request');
                    appendIf('actor', 'explorer-filter-actor');
                    appendIf('minGas', 'explorer-filter-gas');

                    const payload = await apiFetch(`/api/blockchain/explorer${query.toString() ? `?${query.toString()}` : ''}`);
                    const explorer = payload.data || {};
                    document.getElementById('explorer-summary').innerHTML = `
                        <span class="inline-flex items-center gap-2 rounded-full bg-slate-100 text-slate-700 px-3 py-1 text-[11px] font-bold">Entradas ${explorer.summary?.entryCount || 0}</span>
                        <span class="inline-flex items-center gap-2 rounded-full bg-slate-100 text-slate-700 px-3 py-1 text-[11px] font-bold">Grades ${explorer.summary?.dbGrades || 0}</span>
                        <span class="inline-flex items-center gap-2 rounded-full bg-slate-100 text-slate-700 px-3 py-1 text-[11px] font-bold">Auditorías ${explorer.summary?.dbAudits || 0}</span>
                        <span class="inline-flex items-center gap-2 rounded-full bg-slate-100 text-slate-700 px-3 py-1 text-[11px] font-bold">Bloques ${explorer.summary?.blockCount || 0}</span>
                    `;
                    document.getElementById('explorer-contracts').innerHTML = renderContractBadges(explorer.contracts || []);
                    document.getElementById('explorer-count').textContent = `${(explorer.entries || []).length} resultados`;
                    document.getElementById('explorer-list').innerHTML = (explorer.entries || []).map(renderEntry).join('') || '<div class="text-slate-500 text-sm">Sin resultados para estos filtros</div>';
                    document.getElementById('block-count').textContent = `${(explorer.blocks || []).length} bloques`;
                    document.getElementById('block-list').innerHTML = (explorer.blocks || []).map(renderBlock).join('') || '<div class="text-slate-500 text-sm">Sin bloques para mostrar</div>';
                    document.getElementById('audit-list').innerHTML = (explorer.auditEvents || []).slice(0, 6).map(renderAudit).join('') || '<div class="text-slate-500 text-sm">Sin eventos recientes</div>';
                };

                const scheduleExplorerLoad = () => {
                    if (explorerTimer) clearTimeout(explorerTimer);
                    explorerTimer = setTimeout(() => {
                        loadExplorerData().catch((error) => {
                            const explorerList = document.getElementById('explorer-list');
                            if (explorerList) {
                                explorerList.innerHTML = `<div class="p-4 bg-red-50 text-red-600 rounded-2xl border border-red-100 font-bold">${error.message || 'Error al cargar explorador'}</div>`;
                            }
                        });
                    }, 250);
                };

                [
                    'explorer-filter-block',
                    'explorer-filter-hash',
                    'explorer-filter-address',
                    'explorer-filter-event',
                    'explorer-filter-request',
                    'explorer-filter-actor',
                    'explorer-filter-gas'
                ].forEach((id) => {
                    const input = document.getElementById(id);
                    if (input) input.addEventListener('input', scheduleExplorerLoad);
                });

                await loadExplorerData();
            } catch (e) {
                area.innerHTML = '<div class="p-8 bg-red-50 text-red-600 rounded-2xl font-bold border border-red-100">Error al cargar observabilidad</div>';
            }
        }

        async function firmarNota() {
            if (txState !== 'idle') return;
            const resDiv = document.getElementById('res');
            const estudiante = document.getElementById('stu').value.trim();
            const asignatura = document.getElementById('asig').value.trim();
            const nota = Number(document.getElementById('not').value);
            if (!estudiante || !asignatura || Number.isNaN(nota) || nota < 0 || nota > 10) {
                showToast("Completa todos los campos. Nota válida: 0-10.", "error");
                return;
            }
            txState = 'pending_chain';
            resDiv.innerHTML = '<div class="flex items-center justify-center gap-2 text-indigo-600 font-bold"><i data-lucide="refresh-cw" class="w-5 h-5 animate-spin"></i> Minando bloque...</div>';
            lucide.createIcons();
            try {
                const data = await apiFetch('/api/subir-nota', {
                    method: 'POST',
                    body: JSON.stringify({ estudiante, asignatura, nota })
                });
                resDiv.innerHTML = `<div class="p-5 bg-emerald-50 border border-emerald-100 rounded-2xl animate-fade-in">
                    <div class="text-emerald-700 font-bold text-sm mb-2 flex items-center gap-2"><i data-lucide="check-circle" class="w-4 h-4"></i> Bloque confirmado satisfactoriamente</div>
                    <p class="text-[10px] font-mono text-emerald-600 break-all p-3 bg-white/50 rounded-lg">${data.txHash}</p>
                </div>`;
                showToast("Transacción confirmada en blockchain", "success");
            } catch(e) {
                resDiv.innerHTML = '<div class="p-4 bg-red-50 text-red-600 rounded-xl font-bold">Error de red/transacción</div>';
                showToast(e.message || "Error de red/transacción", "error");
            } finally {
                txState = 'idle';
            }
            lucide.createIcons();
        }

        function showQR() {
            const modal = document.getElementById('qr-modal');
            const container = document.getElementById('qrcode-container');
            modal.classList.remove('hidden');
            container.innerHTML = "";
            QrCreator.render({
                text: window.location.href,
                radius: 0.5,
                ecLevel: 'H',
                fill: '#0f172a',
                background: '#ffffff',
                size: 200
            }, container);
        }

        function closeQR() { document.getElementById('qr-modal').classList.add('hidden'); }

        if(currentUser) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = currentUser.name;
            document.getElementById('user-initials').innerText = currentUser.name.split(' ').map(n=>n[0]).join('');
            const menu = document.getElementById('sidebar-menu');
            const roleMenu = MENU_BY_ROLE[currentUser.role] || [];
            roleMenu.forEach(i => {
                menu.innerHTML += `
                <button onclick="loadContent('${i}')" class="w-full text-left p-4 rounded-2xl sidebar-item flex items-center gap-4 text-slate-400 hover:text-white transition group">
                    <div class="p-2 rounded-lg bg-slate-800/50 group-hover:bg-blue-600 transition-colors"><i data-lucide="${ICONS[i]}" class="w-5 h-5"></i></div>
                    <span class="font-semibold text-sm">${i}</span>
                </button>`;
            });
            loadContent(roleMenu[0] || 'Consultar Notas');
            detectWallet();
        }
        if (window.ethereum) {
            window.ethereum.on('accountsChanged', detectWallet);
            window.ethereum.on('chainChanged', detectWallet);
        }
        function logout() { localStorage.clear(); location.reload(); }
        lucide.createIcons();
    </script>
</body>
</html>
