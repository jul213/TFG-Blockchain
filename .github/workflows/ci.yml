name: tfg-ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend-and-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: blockchain/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check backend
        run: node --check server.js

      - name: Compile smart contracts
        run: npx truffle compile

  frontend-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inline frontend JavaScript
        run: node -e "const fs=require('fs');const html=fs.readFileSync('frontend/index.html','utf8');const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]).join('\n');new Function(scripts);"

      - name: Ensure OpenAPI exists
        run: test -s docs/openapi.yaml

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config
