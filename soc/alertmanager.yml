global:
  resolve_timeout: 5m

route:
  receiver: discord-webhook
  group_by: ['alertname', 'severity', 'service']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 2h

time_intervals:
  - name: maintenance_window
    time_intervals:
      - weekdays: ['saturday', 'sunday']
        times:
          - start_time: '02:00'
            end_time: '03:00'

receivers:
  - name: discord-webhook
    webhook_configs:
      - url: "http://tfg_discord_webhook_relay:8080/alert"
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity=~"warning|high"
    equal: ['service']
