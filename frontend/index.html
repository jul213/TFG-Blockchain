<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGU - Sistema de Gestión Universitaria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .sidebar-item { transition: all 0.2s ease; }
        .sidebar-item:hover { background: rgba(255,255,255,0.05); transform: translateX(4px); }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900">

    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-[#0f172a] px-4">
        <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md animate-fade-in">
            <div class="flex justify-center mb-8">
                <div class="p-4 bg-blue-50 rounded-2xl text-blue-600 shadow-sm"><i data-lucide="graduation-cap" class="w-12 h-12"></i></div>
            </div>
            <h2 class="text-3xl font-bold text-center mb-2 text-slate-800">SGU Académico</h2>
            <p class="text-center text-slate-500 mb-8 font-medium">Gestión Universitaria & Blockchain</p>
            <div class="space-y-5">
                <div class="relative">
                    <i data-lucide="user" class="absolute left-3 top-3.5 w-5 h-5 text-slate-400"></i>
                    <input type="text" id="username" class="w-full pl-11 pr-4 py-3.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Usuario">
                </div>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-3 top-3.5 w-5 h-5 text-slate-400"></i>
                    <input type="password" id="password" class="w-full pl-11 pr-4 py-3.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Contraseña">
                </div>
                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-blue-200 active:scale-[0.98]">Acceder al sistema</button>
            </div>
        </div>
    </div>

    <div id="dashboard" class="hidden min-h-screen flex flex-col md:flex-row">
        <aside class="w-full md:w-72 bg-[#0f172a] text-white flex flex-col shrink-0 shadow-2xl z-20">
            <div class="p-8 border-b border-slate-800 flex items-center gap-4">
                <div class="bg-blue-600 p-2 rounded-lg shadow-lg shadow-blue-900/20"><i data-lucide="shield-check" class="w-6 h-6"></i></div>
                <span class="font-bold text-xl tracking-tight">SGU-ERP</span>
            </div>
            <nav id="sidebar-menu" class="flex-1 p-6 space-y-3"></nav>
            <div class="p-8 border-t border-slate-800 bg-[#0a0f1d]">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 bg-slate-700 rounded-full flex items-center justify-center font-bold text-blue-400 border border-slate-600" id="user-initials">JM</div>
                    <div>
                        <p id="user-display-name" class="font-bold text-sm text-white"></p>
                        <p class="text-[10px] text-blue-400 font-bold uppercase tracking-tighter">Profesorado Activo</p>
                    </div>
                </div>
                <button onclick="logout()" class="w-full text-red-400 hover:text-red-300 text-sm flex items-center gap-2 transition group">
                    <i data-lucide="log-out" class="w-4 h-4 group-hover:-translate-x-1 transition"></i> Cerrar Sesión
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 px-10 flex items-center justify-between sticky top-0 z-10">
                <div class="flex items-center gap-3">
                    <div class="w-1 h-6 bg-blue-600 rounded-full"></div>
                    <h1 id="page-title" class="font-bold text-2xl text-slate-800 tracking-tight">Cargando...</h1>
                </div>
                <div class="flex items-center gap-6">
                    <div class="hidden md:flex items-center gap-2.5 text-xs bg-emerald-50 text-emerald-700 px-4 py-2 rounded-full font-bold border border-emerald-100">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> Nodo Blockchain Activo
                    </div>
                    <button onclick="showQR()" class="bg-slate-50 p-3 rounded-xl hover:bg-white hover:shadow-md border border-slate-100 text-slate-600 transition active:scale-95">
                        <i data-lucide="qr-code" class="w-6 h-6"></i>
                    </button>
                </div>
            </header>

            <div id="content-area" class="p-10 overflow-y-auto flex-1"></div>
        </main>
    </div>

    <div id="qr-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center z-50 p-4 transition-all">
        <div class="bg-white p-10 rounded-[2.5rem] max-w-sm w-full text-center shadow-[0_20px_50px_rgba(0,0,0,0.3)] animate-fade-in border border-white/20">
            <h3 class="font-bold text-2xl text-slate-800 mb-2">Acceso Móvil</h3>
            <p class="text-sm text-slate-500 mb-8">Escanea para continuar en tu smartphone</p>
            <div id="qrcode-container" class="inline-block bg-white p-5 rounded-3xl border-2 border-slate-50 mb-8 shadow-inner"></div>
            <button onclick="closeQR()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl hover:bg-black transition shadow-lg">Entendido</button>
        </div>
    </div>

    <script>
        const API_URL = "https://rolled-bestsellers-drums-gas.trycloudflare.com";
        let currentUser = JSON.parse(localStorage.getItem('tfg_user')) || null;

        async function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            if(!user || !pass) return;
            try {
                const res = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user, pass})
                });
                const data = await res.json();
                if(data.success) {
                    localStorage.setItem('tfg_token', data.token);
                    localStorage.setItem('tfg_user', JSON.stringify({role: data.role, name: data.name}));
                    location.reload();
                } else { alert("Credenciales inválidas"); }
            } catch(e) { alert("Servidor offline"); }
        }

        async function loadContent(page) {
            const area = document.getElementById('content-area');
            const token = localStorage.getItem('tfg_token');
            document.getElementById('page-title').innerText = page;
            area.innerHTML = '<div class="flex flex-col items-center justify-center h-64 gap-4"><div class="w-12 h-12 border-4 border-blue-600/20 border-t-blue-600 rounded-full animate-spin"></div><p class="text-slate-400 font-medium animate-pulse">Sincronizando con Postgres...</p></div>';

            if(page === 'Subir Notas') {
                renderSubirNotas();
            } else if(page === 'Consultar Notas') {
                renderConsultarNotas();
            } else {
                try {
                    const res = await fetch(`${API_URL}/api/my-students`, {headers: {'Authorization': `Bearer ${token}`}});
                    const data = await res.json();
                    let html = `<div class="grid grid-cols-1 lg:grid-cols-2 gap-8 animate-fade-in">`;
                    data.forEach(c => {
                        html += `
                        <div class="glass-card p-8 rounded-[2rem] shadow-sm hover:shadow-xl transition-all group">
                            <div class="flex items-center justify-between mb-6">
                                <h3 class="font-bold text-xl text-slate-800">${c.courseName}</h3>
                                <span class="bg-blue-50 text-blue-600 text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-widest">${c.students.length} Inscritos</span>
                            </div>
                            <div class="space-y-3">
                                ${c.students.map(s => `
                                    <div class="flex justify-between items-center p-4 bg-slate-50/50 rounded-2xl border border-transparent hover:border-slate-200 hover:bg-white transition-all">
                                        <div class="flex items-center gap-3">
                                            <div class="w-2 h-2 bg-blue-400 rounded-full"></div>
                                            <span class="font-semibold text-slate-700">${s}</span>
                                        </div>
                                        ${page === 'Pasar Asistencia' ? '<input type="checkbox" class="w-6 h-6 rounded-lg border-slate-300 text-blue-600 focus:ring-blue-500">' : '<span class="text-[9px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-md font-bold">VERIFICADO</span>'}
                                    </div>`).join('')}
                            </div>
                            ${page === 'Pasar Asistencia' ? '<button class="mt-8 w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-black transition shadow-lg">Finalizar Pase de Lista</button>' : ''}
                        </div>`;
                    });
                    area.innerHTML = html + `</div>`;
                } catch(e) { area.innerHTML = '<div class="text-red-500 font-bold p-8 bg-red-50 rounded-2xl border border-red-100">Error: Base de datos no disponible</div>'; }
            }
            lucide.createIcons();
        }

        function renderSubirNotas() {
            document.getElementById('content-area').innerHTML = `
            <div class="max-w-2xl mx-auto glass-card p-12 rounded-[2.5rem] shadow-xl animate-fade-in text-center relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-600 to-indigo-600"></div>
                <div class="bg-indigo-50 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-6 text-indigo-600 shadow-inner">
                    <i data-lucide="database" class="w-10 h-10"></i>
                </div>
                <h2 class="font-bold text-3xl mb-2 text-slate-800 tracking-tight">Sello Blockchain</h2>
                <p class="text-slate-500 mb-10 font-medium">Inmutabilidad garantizada vía Contrato Inteligente</p>
                <div class="space-y-5 text-left">
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase ml-1 mb-2 block">Datos del Estudiante</label>
                        <input id="stu" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 transition" placeholder="Nombre completo">
                    </div>
                    <div class="grid grid-cols-2 gap-5">
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase ml-1 mb-2 block">Asignatura</label>
                            <input id="asig" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 transition" placeholder="Cód/Materia">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase ml-1 mb-2 block">Nota Final</label>
                            <input id="not" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 transition" placeholder="0-100">
                        </div>
                    </div>
                    <button onclick="firmarNota()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-5 rounded-2xl transition shadow-xl shadow-indigo-100 mt-6 active:scale-[0.98]">
                        Certificar en Red Principal
                    </button>
                </div>
                <div id="res" class="mt-8"></div>
            </div>`;
            lucide.createIcons();
        }

        async function renderConsultarNotas() {
            const area = document.getElementById('content-area');
            try {
                const res = await fetch(`${API_URL}/api/consultar-notas`, {
                    headers: {'Authorization': `Bearer ${localStorage.getItem('tfg_token')}`}
                });
                const data = await res.json();
                if(!data.success) throw new Error();

                let html = `
                <div class="animate-fade-in space-y-6">
                    <div class="glass-card p-8 rounded-[2rem] overflow-hidden shadow-sm">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="text-[11px] font-bold text-slate-400 uppercase tracking-widest border-b border-slate-100">
                                    <th class="pb-5 pl-4">Estudiante</th>
                                    <th class="pb-5">Asignatura</th>
                                    <th class="pb-5">Nota</th>
                                    <th class="pb-5 text-center">Certificado Blockchain</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-50">`;

                data.notas.forEach(nota => {
                    html += `
                    <tr class="hover:bg-slate-50/50 transition-colors group">
                        <td class="py-5 pl-4">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 bg-blue-50 rounded-lg flex items-center justify-center text-blue-600 text-xs font-bold">${nota.student_email[0].toUpperCase()}</div>
                                <span class="font-semibold text-slate-700">${nota.student_email}</span>
                            </div>
                        </td>
                        <td class="py-5 text-slate-600 font-medium">${nota.subject}</td>
                        <td class="py-5"><span class="bg-blue-600 text-white px-3 py-1 rounded-lg text-xs font-bold">${nota.grade}</span></td>
                        <td class="py-5">
                            <div class="flex items-center justify-center gap-2">
                                <i data-lucide="link" class="w-3 h-3 text-emerald-500"></i>
                                <span class="text-[10px] font-mono text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-100 max-w-[140px] truncate" title="${nota.blockchain_hash}">
                                    ${nota.blockchain_hash}
                                </span>
                            </div>
                        </td>
                    </tr>`;
                });

                html += `</tbody></table></div></div>`;
                area.innerHTML = html;
            } catch(e) {
                area.innerHTML = '<div class="p-8 bg-red-50 text-red-600 rounded-2xl font-bold border border-red-100 flex items-center gap-3"><i data-lucide="alert-circle"></i> Error al recuperar registros de la base de datos</div>';
            }
            lucide.createIcons();
        }

        async function firmarNota() {
            const resDiv = document.getElementById('res');
            resDiv.innerHTML = '<div class="flex items-center justify-center gap-2 text-indigo-600 font-bold"><i data-lucide="refresh-cw" class="w-5 h-5 animate-spin"></i> Minando bloque...</div>';
            lucide.createIcons();
            try {
                const res = await fetch(`${API_URL}/api/subir-nota`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('tfg_token')}` },
                    body: JSON.stringify({ estudiante: document.getElementById('stu').value, asignatura: document.getElementById('asig').value, nota: document.getElementById('not').value })
                });
                const data = await res.json();
                resDiv.innerHTML = `<div class="p-5 bg-emerald-50 border border-emerald-100 rounded-2xl animate-fade-in">
                    <div class="text-emerald-700 font-bold text-sm mb-2 flex items-center gap-2"><i data-lucide="check-circle" class="w-4 h-4"></i> Bloque confirmado satisfactoriamente</div>
                    <p class="text-[10px] font-mono text-emerald-600 break-all p-3 bg-white/50 rounded-lg">${data.txHash}</p>
                </div>`;
            } catch(e) { resDiv.innerHTML = '<div class="p-4 bg-red-50 text-red-600 rounded-xl font-bold">Error de red</div>'; }
            lucide.createIcons();
        }

        function showQR() {
            const modal = document.getElementById('qr-modal');
            const container = document.getElementById('qrcode-container');
            modal.classList.remove('hidden');
            container.innerHTML = "";
            QrCreator.render({
                text: window.location.href,
                radius: 0.5,
                ecLevel: 'H',
                fill: '#0f172a',
                background: '#ffffff',
                size: 200
            }, container);
        }

        function closeQR() { document.getElementById('qr-modal').classList.add('hidden'); }

        if(currentUser) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = currentUser.name;
            document.getElementById('user-initials').innerText = currentUser.name.split(' ').map(n=>n[0]).join('');
            const menu = document.getElementById('sidebar-menu');
            const icons = {'Pasar Asistencia': 'check-square', 'Subir Notas': 'database', 'Mis Cursos': 'book-open', 'Consultar Notas': 'clipboard-list'};
            ['Pasar Asistencia', 'Subir Notas', 'Consultar Notas', 'Mis Cursos'].forEach(i => {
                menu.innerHTML += `
                <button onclick="loadContent('${i}')" class="w-full text-left p-4 rounded-2xl sidebar-item flex items-center gap-4 text-slate-400 hover:text-white transition group">
                    <div class="p-2 rounded-lg bg-slate-800/50 group-hover:bg-blue-600 transition-colors"><i data-lucide="${icons[i]}" class="w-5 h-5"></i></div>
                    <span class="font-semibold text-sm">${i}</span>
                </button>`;
            });
            loadContent('Subir Notas');
        }
        function logout() { localStorage.clear(); location.reload(); }
        lucide.createIcons();
    </script>
</body>
</html>
